<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramais das Escolas | Secretaria Municipal de Educação de Ijuí</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-950:#04182F;   /* azul quase-marinho, fundo geral */
    --blue-900:#0A2A4E;   /* base institucional */
    --blue-800:#0F3B6B;   /* cards */
    --blue-700:#155089;   /* bordas / hover */
    --blue-100:#D7E6F7;   /* texto secundário sobre azul */
    --ice:#F3F8FF;        /* texto claro / fundo de inputs */
    --gold:#E3A93A;       /* cor de seleção/ativo, contraste com o azul */
    --gold-dark:#B8811E;
    --ok:#3FAE68;
  }
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter', sans-serif;
    color:var(--ice);
    background-color:var(--blue-950);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(21,80,137,0.55), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(227,169,58,0.12), transparent 55%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 26px);
    background-attachment: fixed;
  }
  .font-display{font-family:'Space Grotesk', sans-serif;}

  /* Selo/brasão decorativo do cabeçalho */
  .stamp{
    border:2px solid var(--gold);
    border-radius:9999px;
    position:relative;
    background: radial-gradient(circle at 30% 30%, rgba(227,169,58,0.25), transparent 70%);
  }
  .stamp::before{
    content:"";
    position:absolute; inset:4px;
    border:1px dashed rgba(227,169,58,0.5);
    border-radius:9999px;
  }

  /* Accordion */
  .school-panel{
    display:grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 380ms cubic-bezier(.4,0,.2,1);
  }
  .school-panel.open{ grid-template-rows: 1fr; }
  .school-panel > div{ overflow:hidden; }

  .chevron{ transition: transform 320ms cubic-bezier(.4,0,.2,1); color: var(--gold); }
  .open-chevron .chevron{ transform: rotate(180deg); }

  .school-card{
    background: linear-gradient(180deg, var(--blue-800), var(--blue-900));
    border: 1px solid rgba(215,230,247,0.12);
    transition: border-color 200ms ease, box-shadow 200ms ease, transform 150ms ease;
  }
  .school-card:hover{
    border-color: rgba(227,169,58,0.45);
    box-shadow: 0 6px 24px -6px rgba(0,0,0,0.5);
  }
  /* Card fica destacado em dourado quando expandido (selecionado) */
  .school-card.is-open{
    border-color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold), 0 10px 30px -8px rgba(227,169,58,0.25);
  }
  .school-card.is-open .school-toggle{
    background: linear-gradient(180deg, rgba(227,169,58,0.14), transparent);
  }

  .ramal-row{
    transition: background-color 150ms ease, border-color 150ms ease;
    border: 1px solid rgba(215,230,247,0.10);
  }
  .ramal-row:hover{
    background-color: rgba(227,169,58,0.08);
    border-color: rgba(227,169,58,0.35);
  }

  .copy-btn{
    transition: all 150ms ease;
    background: rgba(243,248,255,0.06);
    border: 1px solid rgba(215,230,247,0.25);
    color: var(--ice);
  }
  .copy-btn:hover{
    background: var(--gold);
    border-color: var(--gold);
    color: var(--blue-950);
  }
  .copy-btn.copied{
    background-color: var(--ok) !important;
    border-color: var(--ok) !important;
    color:#fff !important;
  }

  ::selection{ background: var(--gold); color: var(--blue-950); }

  #searchInput::placeholder{ color: rgba(4,24,47,0.45); }

  /* Foco visível para acessibilidade */
  button:focus-visible, input:focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce){
    .school-panel, .chevron, .school-card, .copy-btn{ transition:none !important; }
  }

  /* Contato (telefone / whatsapp) */
  .contact-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:6px;
  }
  .contact-chip{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    font-weight:600;
    padding:3px 9px;
    border-radius:9999px;
    border:1px solid rgba(215,230,247,0.25);
    color: var(--blue-100);
    background: rgba(243,248,255,0.05);
    text-decoration:none;
    transition: all 150ms ease;
  }
  .contact-chip:hover{
    border-color: var(--gold);
    color: var(--blue-950);
    background: var(--gold);
  }
  .contact-chip.whatsapp:hover{
    border-color: var(--ok);
    background: var(--ok);
    color:#fff;
  }
</style>
</head>
<body class="min-h-screen">

  <!-- ===================== CABEÇALHO ===================== -->
  <header class="border-b border-[var(--gold)]/30 bg-[var(--blue-950)]/90 backdrop-blur sticky top-0 z-20">
    <div class="max-w-3xl mx-auto px-5 py-5 flex items-center gap-4">
      <div class="stamp w-14 h-14 shrink-0 flex items-center justify-center">
        <span class="font-display font-bold text-lg leading-none text-[var(--gold)]">SME</span>
      </div>
      <div class="min-w-0">
        <p class="text-xs tracking-[0.2em] uppercase text-[var(--gold)] font-semibold">Secretaria Municipal de Educação · Ijuí/RS</p>
        <h1 class="font-display font-bold text-2xl sm:text-3xl leading-tight truncate text-white">Lista de Ramais das Escolas</h1>
      </div>
    </div>

    <!-- Busca -->
    <div class="max-w-3xl mx-auto px-5 pb-5">
      <div class="relative">
        <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-[var(--blue-900)]/50" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 104.5 4.5a7.5 7.5 0 0012.15 12.15z"/>
        </svg>
        <input
          id="searchInput"
          type="text"
          placeholder="Buscar escola ou setor pelo nome..."
          class="w-full pl-11 pr-4 py-3 rounded-lg border-2 border-transparent bg-[var(--ice)] text-[var(--blue-950)] font-medium focus:outline-none focus:ring-2 focus:ring-[var(--gold)] focus:border-[var(--gold)]"
          autocomplete="off"
        >
      </div>
      <p id="resultCount" class="text-xs text-[var(--blue-100)]/70 mt-2 pl-1"></p>
    </div>
  </header>

  <!-- ===================== LISTA DE ESCOLAS ===================== -->
  <main class="max-w-3xl mx-auto px-5 py-6">
    <div id="schoolList" class="flex flex-col gap-3"></div>

    <!-- Estado vazio (nenhum resultado na busca) -->
    <div id="emptyState" class="hidden text-center py-16">
      <p class="font-display font-semibold text-lg text-white">Nenhum resultado encontrado</p>
      <p class="text-sm text-[var(--blue-100)]/60 mt-1">Tente buscar por outro nome de escola ou setor.</p>
    </div>
  </main>

  <footer class="max-w-3xl mx-auto px-5 pb-10 pt-4 text-xs text-[var(--blue-100)]/50 text-center">
    Clique no nome da unidade para ver os ramais internos.
  </footer>

// Gera o HTML de uma linha de ramal (com botão copiar)
function renderSectorRow(sector, schoolIdx, sectorIdx){
  const rowId = `ramal-${schoolIdx}-${sectorIdx}`;
  return `
    <div class="ramal-row flex items-center justify-between gap-3 px-4 py-3 rounded-md">

        <p class="text-sm font-medium text-[var(--blue-100)] truncate">${sector.label}</p>
        <p id="${rowId}" class="font-display font-bold text-lg tabular-nums text-white">${sector.ramal}</p>
      </div>
      <button
        type="button"
        class="copy-btn shrink-0 flex items-center gap-1.5 text-xs font-semibold px-3 py-2 rounded-md"
        data-ramal="${sector.ramal}"
        aria-label="Copiar ramal ${sector.ramal} de ${sector.label}"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
        </svg>
        <span class="copy-label">Copiar</span>
      </button>
    </div>
  `;
}

// Gera o HTML dos chips de contato (telefone / whatsapp) de uma escola
function renderContactRow(school){
  const chips = [];

  if (school.phone){
    const telHref = 'tel:+55' + school.phone.replace(/\D/g, '');
    chips.push(`
      <a href="${telHref}" class="contact-chip" onclick="event.stopPropagation()" aria-label="Ligar para ${school.name}">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h2.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-1.723.86a11.037 11.037 0 006.105 6.105l.86-1.723a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
        </svg>
        ${school.phone}
      </a>
    `);
  }

  if (school.whatsapp){
    const waHref = 'https://wa.me/' + school.whatsapp.replace(/\D/g, '');
    chips.push(`
      <a href="${waHref}" target="_blank" rel="noopener" class="contact-chip whatsapp" onclick="event.stopPropagation()" aria-label="Conversar no WhatsApp com ${school.name}">
        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.72.45 3.39 1.32 4.87L2 22l5.36-1.4a9.9 9.9 0 004.68 1.19h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.02c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.12.11-1.8-.11-.42-.13-.96-.31-1.65-.6-2.9-1.25-4.8-4.16-4.94-4.35-.14-.19-1.18-1.57-1.18-3 0-1.42.75-2.12 1.02-2.41.26-.28.57-.35.76-.35h.55c.18 0 .42-.02.64.49.24.55.81 1.9.88 2.04.07.14.11.3.02.49-.09.19-.14.3-.28.46-.14.16-.29.36-.42.48-.14.14-.29.29-.12.57.16.28.72 1.19 1.55 1.93 1.06.95 1.96 1.24 2.24 1.38.28.14.44.12.6-.07.16-.19.68-.79.87-1.06.18-.28.36-.23.6-.14.24.09 1.55.73 1.82.86.27.14.44.2.51.31.07.12.07.68-.17 1.36z"/>
        </svg>
        WhatsApp
      </a>
    `);
  }

  if (chips.length === 0) return '';
  return `<div class="contact-row">${chips.join('')}</div>`;
}

// Gera o HTML de um card de escola
function renderSchoolCard(school, idx){
  const isOpen = openStates.has(idx);
  const sectorsHtml = school.sectors.map((s, i) => renderSectorRow(s, idx, i)).join('');
  const contactHtml = renderContactRow(school);

  return `
    <div class="school-card rounded-xl overflow-hidden ${isOpen ? 'is-open' : ''}" data-school-idx="${idx}">
      <button
        type="button"
        class="school-toggle w-full flex items-center justify-between gap-3 px-5 py-4 text-left ${isOpen ? 'open-chevron' : ''}"
        aria-expanded="${isOpen}"
        aria-controls="panel-${idx}"
      >
        <div class="min-w-0">
          <h2 class="font-display font-semibold text-base sm:text-lg truncate text-white">${school.name}</h2>
          <p class="text-xs text-[var(--blue-100)]/60 mt-0.5">${school.sectors.length} setor(es) cadastrado(s)</p>
          ${contactHtml}
        </div>
        <svg class="chevron w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>

      <div class="school-panel ${isOpen ? 'open' : ''}" id="panel-${idx}">
        <div>
          <div class="px-5 pb-5 pt-1 flex flex-col gap-2 border-t border-white/10">
            ${sectorsHtml}
          </div>
        </div>
      </div>
    </div>
  `;
}

// Renderiza a lista completa, aplicando o filtro de busca (nome da escola OU do setor)
function renderList(){
  const query = searchInput.value.trim().toLowerCase();

  const filtered = schools
    .map((school, idx) => ({ school, idx }))
    .filter(({ school }) => {
      if (!query) return true;
      const nameMatch = school.name.toLowerCase().includes(query);
      const sectorMatch = school.sectors.some(s => s.label.toLowerCase().includes(query) || s.ramal.includes(query));
      return nameMatch || sectorMatch;
    });

  resultCountEl.textContent = query
    ? `${filtered.length} de ${schools.length} unidade(s)`
    : `${schools.length} unidade(s) cadastrada(s)`;

  if (filtered.length === 0){
    schoolListEl.innerHTML = '';
    emptyStateEl.classList.remove('hidden');
    return;
  }

  emptyStateEl.classList.add('hidden');
  schoolListEl.innerHTML = filtered
    .map(({ school, idx }) => renderSchoolCard(school, idx))
    .join('');
}

// Alterna abrir/fechar de uma escola
function toggleSchool(idx){
  if (openStates.has(idx)) openStates.delete(idx);
  else openStates.add(idx);
  renderList();
}

// Copia o número do ramal para a área de transferência
async function copyRamal(button){
  const ramal = button.getAttribute('data-ramal');
  try {
    await navigator.clipboard.writeText(ramal);
  } catch (err){
    // Fallback para navegadores/contextos sem Clipboard API
    const textarea = document.createElement('textarea');
    textarea.value = ramal;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);
  }

  const label = button.querySelector('.copy-label');
  const originalText = label.textContent;
  button.classList.add('copied');
  label.textContent = 'Copiado!';
  setTimeout(() => {
    button.classList.remove('copied');
    label.textContent = originalText;
  }, 1500);
}

// Delegação de eventos: clique no cabeçalho da escola OU no botão copiar
schoolListEl.addEventListener('click', (e) => {
  const copyBtn = e.target.closest('.copy-btn');
  if (copyBtn){
    copyRamal(copyBtn);
    return;
  }
  const toggleBtn = e.target.closest('.school-toggle');
  if (toggleBtn){
    const card = toggleBtn.closest('.school-card');
    toggleSchool(Number(card.dataset.schoolIdx));
  }
});

// Busca instantânea
searchInput.addEventListener('input', renderList);

// Primeira renderização
renderList();
</script>
